name: Build & Publish Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runner
            image: dub-web
          - target: builder
            image: dub-migrate
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner name
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/web/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || '' }}
            NEXT_PUBLIC_SELFHOST_DOMAINS=${{ vars.SELFHOST_DOMAINS || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
